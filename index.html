<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblia Católica</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="cross">✝</div>
    <h1>Santa Biblia</h1>
    <p class="subtitle">Palabra de Dios · varias versiones</p>
  </header>

  <main class="container">
    <section class="controls" aria-label="Buscador">
      <div class="field">
        <label for="version">Versión</label>
        <select id="version"></select>
      </div>

      <div class="field grow">
        <label for="reference">Pasaje</label>
        <select id="reference"></select>
      </div>

      <button id="search" type="button">Leer</button>
    </section>

    <section id="result" class="result" aria-live="polite">
      <p class="hint">Cargando la Palabra…</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>Textos de dominio público · Reina-Valera 1909 y King James</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
